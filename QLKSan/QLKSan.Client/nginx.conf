# Trang khách (React) trong Docker: phục vụ bản build và chuyển /api, /uploads tới Gateway (cùng nguồn, không cần CORS)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Token đăng nhập (kể cả nhân viên) nằm trong sessionStorage: CSP chặt để giảm rủi ro XSS.
    # Chỉ chạy script / gọi API cùng nguồn; font + CSS từ Google Fonts; ảnh cùng nguồn (và blob: khi xem trước ảnh tải lên).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        # Gateway tin X-Forwarded-For từ mạng nội bộ: giới hạn tần suất theo IP thật của khách
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # Tệp build có hash trong tên: lưu đệm lâu dài
    # (add_header trong location thay thế toàn bộ header khai báo ở cấp server, nên lặp lại header bảo mật ở mỗi location)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Định tuyến phía trình duyệt: mọi đường dẫn khác trả index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
