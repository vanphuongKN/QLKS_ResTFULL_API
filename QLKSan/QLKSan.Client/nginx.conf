# Trang khách (React) trong Docker: phục vụ bản build và chuyển /api, /uploads tới Gateway (cùng nguồn, không cần CORS)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        # Gateway tin X-Forwarded-For từ mạng nội bộ: giới hạn tần suất theo IP thật của khách
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # Tệp build có hash trong tên: lưu đệm lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Định tuyến phía trình duyệt: mọi đường dẫn khác trả index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
