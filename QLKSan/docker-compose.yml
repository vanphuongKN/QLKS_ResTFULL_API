# Chạy toàn bộ hệ thống bằng Docker: docker compose up -d --build   (tạo file .env từ .env.example trước)
# Trang khách (React): http://localhost:7082   Web (MVC, nhân viên): http://localhost:7081   Gateway (API): http://localhost:7080/api/health   RabbitMQ: http://localhost:15672   SQL Server: localhost,14330
# Trình duyệt và Web chỉ đi qua Gateway; API lõi, ChatBot và service thông báo không mở cổng ra ngoài.
name: qlksan

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Đặt SA_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-14330}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Chạy một lần: tạo database từ script nếu chưa có
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ../DB:/db:ro
      - ./docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management
    # Chạy thẳng bằng user rabbitmq: entrypoint chạy root không đọc được .erlang.cookie trên một số bản Docker Desktop
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: qlksan
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Đặt RABBITMQ_PASSWORD trong .env}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: QLKSan.API/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=QuanLyKhachSanc#;User Id=sa;Password=${SA_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Đặt JWT_KEY (tối thiểu 32 ký tự) trong .env}
      Messaging__Enabled: "true"
      Messaging__RabbitMqUri: amqp://qlksan:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ForwardedHeaders__MangTinCay__0: 172.28.0.0/16
    volumes:
      - uploads:/app/wwwroot/uploads
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: QLKSan.Notification/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMq__Uri: amqp://qlksan:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Email__ThuMucLuu: /app/mail
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__TenDangNhap: ${SMTP_USER:-}
      Email__Smtp__MatKhau: ${SMTP_PASSWORD:-}
    volumes:
      - mail:/app/mail
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: QLKSan.ChatBot/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ChatBot__Provider: ${CHATBOT_PROVIDER:-RuleBased}
      ChatBot__ApiBaseUrl: http://gateway:8080/
      ChatBot__WebBaseUrl: http://localhost:${WEB_PORT:-7081}/
      ChatBot__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      ChatBot__OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      ConnectionStrings__ChatDb: Data Source=/app/data/chatbot.db
      ForwardedHeaders__MangTinCay__0: 172.28.0.0/16
    volumes:
      - chatdata:/app/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: QLKSan.Gateway/Dockerfile
    depends_on:
      - api
      - chatbot
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY}
      ReverseProxy__Clusters__core__Destinations__api__Address: http://api:8080/
      ReverseProxy__Clusters__chatbot__Destinations__chatbot__Address: http://chatbot:8080/
      # Web nằm trong mạng nội bộ: tin X-Forwarded-For do Web gửi
      Gateway__MangTinCay__0: 172.28.0.0/16
    ports:
      - "${API_PORT:-7080}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: QLKSan.Web/Dockerfile
    depends_on:
      - gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: http://gateway:8080/
      ApiSettings__PublicUrl: http://localhost:${API_PORT:-7080}/
      DataProtection__KeysPath: /app/keys
    ports:
      - "${WEB_PORT:-7081}:8080"
    volumes:
      - webkeys:/app/keys
    restart: unless-stopped

  # Trang khách React (QLKSan.Client): nginx phục vụ bản build, /api và /uploads chuyển tới Gateway
  client:
    build:
      context: .
      dockerfile: QLKSan.Client/Dockerfile
    depends_on:
      - gateway
    ports:
      - "${CLIENT_PORT:-7082}:8080"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  sqldata:
  rabbitmq:
  uploads:
  mail:
  chatdata:
  webkeys:
